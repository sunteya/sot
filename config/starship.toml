"$schema" = 'https://starship.rs/config-schema.json'


add_newline = false
format = """
$username\
$hostname\
$directory\
${custom.conda_env}\
${custom.git_branch_filtered}\
$git_status\
$character
"""
[username]
format = '[$user]($style)@'

[hostname]
# ssh_only = false

[directory]
fish_style_pwd_dir_length = 1

[custom.conda_env]
command = '''
if [ ${#CONDA_DEFAULT_ENV} -gt 14 ]; then
    echo "@${CONDA_DEFAULT_ENV:0:13}…"
else
    echo "@${CONDA_DEFAULT_ENV}"
fi
'''
shell = ["bash", "--noprofile", "--norc"]
when = 'test -n "$CONDA_DEFAULT_ENV"'
style = "bold green"

[custom.git_branch_filtered]
command = """
branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
if [[ "$branch" == "master" || "$branch" == "main" ]]; then
    echo ""
elif [[ -n "$branch" ]]; then
    echo " $branch"
fi
"""
shell = ["bash", "--noprofile", "--norc"]
when = "git rev-parse --is-inside-work-tree"
style = "bold purple"

[conda]
symbol = '@'
format = '[$symbol$environment]($style) '

[character]
format = '$symbol'
success_symbol = ''
error_symbol = '[⨯](bold red) '

